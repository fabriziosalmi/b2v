repos:
  - repo: https://pre-commit.com/hooks/pre-commit-config
    hooks:
      - id: check-yaml
        name: Check YAML
        entry: check-yaml
        language: system
        files: 
          - .pre-commit-config.yaml
      - id: rustfmt
        name: Rustfmt check
        entry: rustfmt
        language: system
        files: 
          - src/**/*.rs
      - id: prettier
        name: Prettier check (for TS/JS)
        entry: prettier --write-file
        language: system
        types: [ts, js]
        files: 
          - docs/**/*.ts
          - src/**/*.test.ts
      - id: prettier
        name: Prettimal check (for JS/TS)
        entry: prettier --write-file
        language: system
        types: [ts, js]
        files: 
          - src/**/*.ts
          - src/**/*.js
      - id: rustfmt
        name: Rustfmt check (for all rs files)
        entry: rustfmt
        language: system
        files: 
          - src/**/*.rs