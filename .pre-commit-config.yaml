repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fix
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        name: Prettier formatting for JS/TS
        args: [--write]

  - repo: local
    hooks:
      - id: rustfmt
        name: Rust fmt
        entry: rustfmt
        language: system